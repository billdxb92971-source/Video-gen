<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Product Video Generator</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #121829;
    --accent: #7c5cff;
    --accent2: #2dd4bf;
    --text: #eef1f8;
    --muted: #94a0b8;
    --border: #232b41;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: radial-gradient(circle at top, #151c30, var(--bg));
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 24px;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  textarea, select, input[type=text] {
    width: 100%;
    background: #0d1220;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 100px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #08101f;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .progress-track {
    height: 8px;
    background: #0d1220;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 10px;
    border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }
  video { width: 100%; border-radius: 12px; margin-top: 16px; border: 1px solid var(--border); }
  .script-preview { font-size: 13px; color: var(--muted); margin-top: 16px; white-space: pre-wrap; line-height: 1.5; }
  .scene { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .scene:last-child { border-bottom: none; }
  .scene b { color: var(--text); }
  a.download { display: inline-block; margin-top: 12px; color: var(--accent2); font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Product Video Generator</h1>
  <p class="sub">Prompt → script → AI-generated video scenes with native voice → stitched final ad.</p>

  <div class="panel">
    <label for="prompt">Describe the product &amp; the video you want</label>
    <textarea id="prompt" placeholder="e.g. 30 second ad for a dental lab SaaS called ClearPro Lab. Show a busy dental lab, a technician using the AI voice assistant Aria, then a case getting approved instantly. End with the ClearPro Lab logo and tagline 'Faster cases, happier dentists.'"></textarea>

    <label for="provider">Video model</label>
    <select id="provider"></select>

    <label for="scriptProvider">Script writer</label>
    <select id="scriptProvider"></select>

    <div class="row">
      <div>
        <label for="scenes">Number of scenes (8s each)</label>
        <select id="scenes">
          <option value="2">2 (~16s)</option>
          <option value="3" selected>3 (~24s)</option>
          <option value="4">4 (~32s)</option>
          <option value="5">5 (~40s)</option>
        </select>
      </div>
      <div>
        <label for="aspect">Aspect ratio</label>
        <select id="aspect">
          <option value="16:9" selected>16:9 (YouTube/web)</option>
          <option value="9:16">9:16 (Reels/TikTok)</option>
        </select>
      </div>
    </div>

    <label for="tone">Tone</label>
    <input type="text" id="tone" value="energetic and modern" />

    <label for="style">Visual style</label>
    <input type="text" id="style" value="clean cinematic product-ad style, soft studio lighting, shallow depth of field" />

    <button id="generateBtn">Generate Video</button>
    <div class="status" id="statusText"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <video id="resultVideo" controls></video>
    <a class="download" id="downloadLink" download>Download final.mp4</a>
    <div class="script-preview" id="scriptPreview"></div>
  </div>
</div>

<script>
const btn = document.getElementById("generateBtn");
const statusText = document.getElementById("statusText");
const progressFill = document.getElementById("progressFill");
const resultPanel = document.getElementById("resultPanel");
const resultVideo = document.getElementById("resultVideo");
const downloadLink = document.getElementById("downloadLink");
const scriptPreview = document.getElementById("scriptPreview");
const providerSelect = document.getElementById("provider");
const scriptProviderSelect = document.getElementById("scriptProvider");

(async () => {
  const { video, script } = await fetch("/api/providers").then((r) => r.json());

  providerSelect.innerHTML = video.map((p) => `<option value="${p.id}">${p.label}</option>`).join("");
  const seedance = video.find((p) => p.id === "seedance");
  if (seedance) providerSelect.value = "seedance";

  scriptProviderSelect.innerHTML = script.map((p) => `<option value="${p.id}">${p.label}</option>`).join("");
  const falLlm = script.find((p) => p.id === "fal-llm");
  if (falLlm) scriptProviderSelect.value = "fal-llm";
})();

btn.addEventListener("click", async () => {
  const prompt = document.getElementById("prompt").value.trim();
  if (!prompt) { alert("Describe the video you want first."); return; }

  btn.disabled = true;
  resultPanel.style.display = "none";
  statusText.textContent = "Starting…";
  progressFill.style.width = "2%";

  const body = {
    prompt,
    sceneCount: document.getElementById("scenes").value,
    aspectRatio: document.getElementById("aspect").value,
    tone: document.getElementById("tone").value,
    style: document.getElementById("style").value,
    provider: providerSelect.value,
    scriptProvider: scriptProviderSelect.value,
  };

  try {
    const startRes = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const { jobId, error } = await startRes.json();
    if (error) throw new Error(error);

    const poll = setInterval(async () => {
      const statusRes = await fetch(`/api/status/${jobId}`);
      const job = await statusRes.json();

      progressFill.style.width = (job.progress || 0) + "%";
      statusText.textContent = humanizeStatus(job.status);

      if (job.status === "done") {
        clearInterval(poll);
        btn.disabled = false;
        resultPanel.style.display = "block";
        resultVideo.src = job.videoUrl;
        downloadLink.href = job.videoUrl;
        scriptPreview.innerHTML = renderScript(job.script);
      } else if (job.status === "error") {
        clearInterval(poll);
        btn.disabled = false;
        statusText.textContent = "Error: " + job.error;
      }
    }, 4000);
  } catch (e) {
    btn.disabled = false;
    statusText.textContent = "Error: " + e.message;
  }
});

function humanizeStatus(s) {
  if (!s) return "";
  if (s === "writing_script") return "Writing marketing script…";
  if (s === "generating_scenes") return "Generating scenes…";
  if (s.startsWith("generating_scene_")) {
    const [, idx, , total] = s.split("_");
    return `Generating scene ${idx} of ${total}…`;
  }
  if (s === "stitching") return "Stitching final video…";
  if (s === "done") return "Done!";
  return s;
}

function renderScript(script) {
  if (!script) return "";
  let html = `<b>${script.title || "Script"}</b><br/><br/>`;
  for (const s of script.scenes) {
    html += `<div class="scene"><b>Scene ${s.index}:</b> ${s.visual_description}<br/>${s.dialogue_or_vo ? '"' + s.dialogue_or_vo + '"' : "(no dialogue)"}</div>`;
  }
  return html;
}
</script>
</body>
</html>

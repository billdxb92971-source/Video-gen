services:
  - type: web
    name: ai-video-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # video generation calls are mostly waiting on external APIs, but bump to "standard" if stitching many/large clips feels slow
    healthCheckPath: /
    envVars:
      - key: FAL_KEY
        sync: false        # set manually in the Render dashboard — never commit real keys
      - key: GEMINI_API_KEY
        sync: false        # optional — only needed if you use the Gemini/Veo options
      - key: HEYGEN_API_KEY
        sync: false        # optional — only needed for the HeyGen Avatar (real lip-sync) option
    disk:
      name: video-output
      mountPath: /app/output
      sizeGB: 1             # generated videos are ephemeral job output; raise this if you expect many concurrent/large jobs
